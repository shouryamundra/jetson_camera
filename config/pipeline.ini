# Pipeline settings for jetson_camera (read by io::load_pipeline_config).
# Camera image settings (white balance, gamma, ...) live in the MVS feature file below; this file
# holds everything the pipeline itself decides. Unknown keys are rejected, so typos are caught.
# Override any key on the command line:  --set recorder.fps=60 --set camera.exposure_us=4000

[camera]
# MVS feature file, relative to this file. Applied first; the keys below override it.
feature_file = camera.ini
# Exposure in microseconds; 0 keeps the feature file's value (8330 -> 117 fps).
# Frame rate is about min(215, 1e6 / exposure) with the 812-row window. <= ~4600 keeps 215 fps.
# 4300 = about half the light of 8330; keeps 215 fps.
exposure_us = 4300
# Analog gain in dB; -1 keeps the feature file's value. +6 dB doubles brightness (and noise).
# -1 = the feature file's 3.985 dB. Maximum 16.98.
gain_db = -1
# Rows read from the sensor (centred, multiple of 4). 812 = 16:9 for 1440 columns: 215 fps
# max. 1080 = full sensor: 164 fps max, the extra rows are cropped away on the GPU. 0 = keep.
sensor_height = 960
# true: exposure and readout alone set the frame rate (AcquisitionFrameRate cap off).
unlimited_frame_rate = true
# SDK receive buffers. >= 6 measured to lose nothing at 215 fps.
sdk_buffers = 8
# GetImageBuffer timeout; bounds how long stop() can take.
grab_timeout_ms = 100

[output]
# Model input size. The camera reads a 1.5x larger centred window (1440x810 for 960x540).
width = 640
height = 640
# Model tensor 1x3xHxW in GPU memory, values in [0,1].
tensor = true
tensor_fp16 = true
# Plane order. false = B,G,R (what Project Otto feeds its model today).
tensor_rgb = true
# Kernel load strategy: false = per-thread read-only-cache loads, true = one
# shared-memory tile per block. Chosen by measurement (preprocess_test).
shared_tile = false
# HxWx3 BGR image in CPU-readable memory (numpy). Turn off if nothing on the CPU needs pixels.
bgr = true
# NV12 frame for the recorder. Must be true when recording.
nv12 = true
# Frames that can be held at once by all consumers together (mailbox + detector + recorder).
pool_size = 16

[threads]
# SCHED_FIFO for the grab thread. Needs: sudo setcap cap_sys_nice+ep <binary> (or root).
realtime_priority = true
realtime_level = 80
# Pin the grab thread to this CPU core; -1 = no pinning. See deploy/README.md for the core plan
# (core 4 also receives the USB interrupts there).
cpu = 4
# Pin the watchdog thread (wakes every check_ms, nearly idle); -1 = no pinning.
watchdog_cpu = -1
# mlockall(): no page faults on the hot path. Needs a memlock limit (deploy/ sets it).
lock_memory = true

[timing]
# Fixed sensor-readout + USB delay subtracted to get exposure start on the host clock.
# -1 = estimate as rows * line_time_us + latency_base_us (812 rows -> 4740 us).
latency_us = -1
line_time_us = 5.653
latency_base_us = 150
# Clock sync: sliding-minimum window, jump size treated as a clock restart, and how many
# consecutive jumped frames confirm a restart.
clock_window_ms = 2000
clock_reset_ms = 200
clock_reset_frames = 5

[watchdog]
# Supervises the camera: on an SDK disconnect event or a stall it closes the device and reopens
# it with exponential backoff, resetting the camera's USB port every usb_reset_after failures.
enabled = true
# No frame for this long counts as a stall (frames normally arrive every 4.6-8.5 ms).
stall_ms = 500
check_ms = 20
retry_ms = 200
retry_max_ms = 3000
# 0 = never reset the USB port.
usb_reset_after = 3

[recorder]
# Frames per second written to disk (deadline-paced); 0 = every camera frame.
fps = 30
# H.265 target bitrate, bits per second.
bitrate = 8000000
# Frames waiting for the encoder before the OLDEST is dropped.
queue = 4
# How long shutdown waits for the encoder to finish the file.
finish_timeout_ms = 5000
# Split recordings into segments of this many seconds (out.mkv -> out_00000.mkv,
# out_00001.mkv, ...); each is playable on its own, so a crash loses at most one
# segment. 0 = one file.
segment_s = 60
# Keep at most this many segments; the oldest is deleted when a new one starts.
# 30 x 60 s at 8 Mbit/s is about 1.8 GB. 0 = keep all.
max_files = 30
# Pause recording while free disk space is below this (MB), resume at 120%.
# Checked once a second on a separate thread. 0 = no check.
min_free_mb = 1024
