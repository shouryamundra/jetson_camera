# cpplint (Google C++ style). Deliberate deviations, each with its reason:
set noparent
linelength=80
extensions=h,cc,cu
headers=h
# Header guards are JETSON_CAMERA_<PATH>_<FILE>_H_ (path from the repo's parent).
root=..
# No company copyright notice is required in this repository.
filter=-legal/copyright
# <chrono>, <thread>, <mutex>, <filesystem> are standard C++ and needed; the
# rule reflects Google-internal library preferences.
filter=-build/c++11,-build/c++17
# Exceptions are used for setup errors only (constructor/config failures);
# every hot path is noexcept and reports errors by counting.
# clang-format (Google style) is authoritative for whitespace.
filter=-whitespace/indent_namespace
